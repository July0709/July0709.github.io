<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动画预览 — 女孩与猫 · 走进书柜</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        background: #122F0B;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #DFF0E4;
        padding: 2rem 1rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .05em; }
    .stage {
        position: relative;
        width: min(860px, 92vw);
        aspect-ratio: 3 / 2;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,.4);
        background: #b5d56a;
    }
    .stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity .55s ease;
    }
    .stage img.show { opacity: 1; }
    .caption {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        padding: 4px 16px;
        border-radius: 999px;
        background: rgba(0,0,0,.42);
        color: #fff;
        font-size: .85rem;
        letter-spacing: .1em;
        white-space: nowrap;
        transition: opacity .4s ease;
    }
    .replay {
        border: 1px solid rgba(223,240,228,.4);
        background: transparent;
        color: #DFF0E4;
        padding: .45rem 1.4rem;
        border-radius: 999px;
        font-size: .85rem;
        cursor: pointer;
        transition: background .2s ease;
    }
    .replay:hover { background: rgba(223,240,228,.12); }
</style>
</head>
<body>
    <h1>女孩与猫 · 走进书柜（动画预览）</h1>
    <div class="stage" id="stage">
        <img src="frame1.jpg" alt="抱猫互动">
        <img src="frame2.jpg" alt="放下小猫">
        <img src="frame3.jpg" alt="走向书柜">
        <img src="frame4.jpg" alt="走进魔法书">
        <div class="caption" id="caption"></div>
    </div>
    <button class="replay" id="replay" type="button">↻ 重新播放</button>

<script>
(function () {
    var imgs = document.querySelectorAll('#stage img');
    var caption = document.getElementById('caption');
    var steps = [
        { t: 1900, text: '抱着小猫，亲密互动 ❤' },
        { t: 1400, text: '轻轻放下小猫' },
        { t: 1400, text: '转身走向书柜' },
        { t: 2300, text: '走进发光的魔法书 ✨' }
    ];
    var timers = [];
    var i = 0;

    function show(n) {
        imgs.forEach(function (im, k) { im.classList.toggle('show', k === n); });
        caption.textContent = steps[n].text;
    }
    function loop() {
        show(i);
        timers.push(setTimeout(function () {
            i = (i + 1) % steps.length;
            loop();
        }, steps[i].t));
    }
    document.getElementById('replay').addEventListener('click', function () {
        timers.forEach(clearTimeout);
        timers = [];
        i = 0;
        loop();
    });
    loop();
})();
</script>
</body>
</html>
